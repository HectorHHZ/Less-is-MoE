[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "less-is-moe"
version = "0.1.0"
description = "Less is MoE (EMNLP 2026 Oral): Fisher-MoE, intra-expert structured pruning and compression for Mixture-of-Experts (MoE) large language models."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Haoze He"},
  {name = "Xinkai Zou"},
  {name = "Xuan Jiang"},
  {name = "Xingyuan Ding"},
  {name = "Ao Qu"},
  {name = "Juncheng Billy Li"},
  {name = "Heather Miller"},
]
keywords = [
  "mixture-of-experts",
  "moe",
  "expert-pruning",
  "model-compression",
  "structured-pruning",
  "neuron-pruning",
  "pruning",
  "large-language-models",
  "llm",
  "efficient-inference",
  "fisher-information",
  "qwen",
  "olmoe",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "datasets>=3.2.0",
  "latex2sympy2_extended>=1.0.6",
  "math-verify==0.5.2",
  "numpy>=1.26",
  "packaging>=23.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "safetensors>=0.3.3",
  "sentencepiece>=0.1.99",
  "tqdm>=4.66",
]

[project.urls]
Paper = "https://arxiv.org/abs/2606.05538"
Repository = "https://github.com/HectorHHZ/Less-is-MoE"
Issues = "https://github.com/HectorHHZ/Less-is-MoE/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]
judge = ["openai>=1.0,<3"]

[project.entry-points."vllm.general_plugins"]
less_is_moe = "less_is_moe.model_patches.vllm_plugin:register"
less_is_moe_ragged = "less_is_moe.intdim.ragged_plugin:register"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
