# Editable base-model SFT template. Replace values marked REPLACE_WITH_*.
model_name_or_path: REPLACE_WITH_OLMOE_BASE_MODEL_ID_OR_PATH
trust_remote_code: true
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

dataset_name: yentinglin/s1K-1.1-trl-format
dataset_config: null
dataset_train_split: train
dataset_num_proc: 8

bf16: true
do_eval: false
eval_strategy: "no"
gradient_accumulation_steps: 1
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 1.0e-05
log_level: info
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
packing: true
max_length: 8192
max_steps: -1
num_train_epochs: 2
output_dir: outputs/sft/base/olmoe
overwrite_output_dir: false
per_device_eval_batch_size: 1
per_device_train_batch_size: 1
push_to_hub: false
report_to: none
save_strategy: epoch
seed: 1234
use_liger: false
warmup_ratio: 0.1
