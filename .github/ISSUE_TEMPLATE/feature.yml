name: Feature request
description: A new capability, such as a pruning option or quantization backend
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current code does not support it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Would this change the reported protocol or a reported number?
      description: A new criterion must be added as a named option, not replace the default.
      options: ["No", "Yes", Not sure]
    validations:
      required: true
